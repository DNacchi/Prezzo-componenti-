
name: Monitor Prezzi PC

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

concurrency:
  group: monitor-prezzi-pc
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  scrape-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Allinea con l'ultima versione remota
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin main --no-edit

      - name: Esegui scraping prezzi
        run: python scripts/scraper.py

      - name: Invia notifiche Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/notify.py

      - name: Genera dashboard
        run: python scripts/build_dashboard.py

      - name: Commit e push dei dati aggiornati
        run: |
          git add data/ docs/
          git diff --staged --quiet && echo "Nessuna modifica da salvare" && exit 0
          git commit -m "Aggiornamento prezzi automatico"
          for i in 1 2 3 4 5; do
            git pull origin main --no-edit && git push && break
            echo "Push fallito, tentativo $i, riprovo tra 5s..."
            sleep 5
          done

  deploy-pages:
    needs: scrape-and-publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
