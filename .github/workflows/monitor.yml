name: Monitor Prezzi PC

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

concurrency:
  group: monitor-prezzi-pc
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  scrape-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Installa browser Playwright
        run: playwright install --with-deps chromium

      - name: Esegui scraping prezzi
        run: python scripts/scraper.py

      - name: Controlla compatibilita' componenti
        run: python scripts/check_compatibility.py

      - name: Invia notifiche Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/notify.py

      - name: Genera dashboard
        run: python scripts/build_dashboard.py

      - name: Commit e push dei dati aggiornati
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ docs/
          if git diff --staged --quiet; then
            echo "Nessuna modifica da salvare"
            exit 0
          fi
          git commit -m "Aggiornamento prezzi automatico"
          git fetch origin main
          if git push origin HEAD:main; then
            echo "Push riuscito"
          else
            echo "Push fallito: il remoto e' stato aggiornato nel frattempo."
            echo "Scarto questo ciclo (si aggiorna al prossimo giro)."
            git reset --hard origin/main
          fi

  deploy-pages:
    needs: scrape-and-publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
